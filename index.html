<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1, viewport-fit=auto">
    <meta charset="utf-8" />
    <title>Blue Squares</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body id="body">
    <canvas id="game-canvas"></canvas>
    <div id="notifications"></div>
    <div id="building-create" class="collapse-building-create open-building-create">
      <div id="buy-buttons">
        <div id="first-buy">
          <img src="images/create-squares/create-blue-square.png" alt="Blue Square">
          <button id="blue-square-buy"><span id="blue-square-cost">Buy 0</span><div class="resource-icon blue"></div></button>
        </div>
        <div>
          <img src="images/create-squares/create-red-square.png" alt="Red Square">
          <button id="red-square-buy"><span id="red-square-cost">Buy 0</span><div class="resource-icon red"></div></button>
        </div>
        <div>
          <img src="images/create-squares/create-green-square.png" alt="Green Square">
          <button id="green-square-buy"><span id="green-square-cost">Buy 0</span><div class="resource-icon green"></div></button>
        </div>
        <div>
          <img src="images/create-squares/create-purple-square.png" alt="Purple Square">
          <button id="purple-square-buy"><span id="purple-square-cost">Buy 0</span><div class="resource-icon purple"></div></button>
        </div>
        <div>
          <img src="images/create-squares/create-orange-square.png" alt="Orange Square">
          <button id="orange-square-buy"><span id="orange-square-cost">Buy 0</span><div class="resource-icon orange"></div></button>
        </div>
        <div>
          <img src="images/create-squares/create-yellow-square.png" alt="Yellow Square">
          <button id="yellow-square-buy"><span id="yellow-square-cost">Buy 0</span><div class="resource-icon yellow"></div></button>
        </div>
        <div id="last-buy">
          <img src="images/create-squares/create-white-square.png" alt="White Square">
          <button id="white-square-buy"><span id="white-square-cost">Buy 0</span><div class="resource-icon white"></div></button>
        </div>
      </div>
      <div id="toggle-building-create">
        <p>▼</p>
       </div>
    </div>
    <div id="building-info" class="collapse-building-info open-building-info">
      <h2 id="building-info-no-content">No Content</h2>
      <div id="building-info-content">
        <h2 id="building-info-square_type">Square</h2>
        <h3 id="building-info-level">Level: </h3>
        <p id="created-text">Created on: </p>
        <p id="building-info-earnings_second">Earnings per second: </p>
        <p id="building-info-earnings_hour">Earnings per second: </p>
        <button id="building-info-upgrade"><span id="building-info-upgrade-text">Upgrade </span><div id="building-info-upgrade-resource-icon" class="resource-icon blue"></button>
        <p id="refund-text">*square will be 100% refunded*</p>
        <button id="building-info-delete"><span id="building-info-delete-text">Delete </span><div id="building-info-delete-resource-icon" class="resource-icon blue"></button>
      </div>
       <div id="toggle-building-info">
        <p>▶</p>
       </div>
    </div>
    <div id="options">
      <img src="images/leaderboard.png" id="leaderboard" alt="Leaderboard">
      <img src="images/settings.png" id="settings" alt="Settings">
    </div>
    <div id="resources">
      <div><span id="blue-squares-count">XXXXX</span><div class="resource-icon blue"></div></div>
      <div><span id="red-squares-count">XXXXX</span><div class="resource-icon red"></div></div>
      <div><span id="green-squares-count">XXXXX</span><div class="resource-icon green"></div></div>
      <div><span id="purple-squares-count">XXXXX</span><div class="resource-icon purple"></div></div>
      <div><span id="orange-squares-count">XXXXX</span><div class="resource-icon orange"></div></div>
      <div><span id="yellow-squares-count">XXXXX</span><div class="resource-icon yellow"></div></div>
      <div><span id="white-squares-count">XXXXX</span><div class="resource-icon white"></div></div>
    </div>
    <div id="resource-displays"></div>
    <div id="leaderboard-tab-container">
      <div id="leaderboard-tab-close"></div>
      <div id="leaderboard-tab">
        <h2>Leaderboard</h2>
        <p id="close-leaderboard">X</p>
        <hr>
      </div>
    </div>
    <div id="settings-tab-container">
      <div id="settings-tab-close"></div>
      <div id="settings-tab">
        <h2>Settings</h2>
        <p id="close-settings">X</p>
        <hr>
        <div class="toggle">
          <label>All notifications</label>
          <label class="switch settings-switch">
              <input type="checkbox" id="all-notifications-toggle">
              <span class="slider round"></span>
          </label>
        </div>
        <div id="other-notification-contianer">
          <div class="other-notification-toggle" id="selector-1">
            <label>Invalid movement</label>
            <label class="switch settings-switch">
                <input type="checkbox" id="notification-invalid-movement-toggle">
                <span class="slider round"></span>
            </label>
          </div>
          <div class="other-notification-toggle" id="selector-2">
            <label>Not enough for upgrade</label>
            <label class="switch settings-switch">
                <input type="checkbox" id="notification-not-enough-upgrade-toggle">
                <span class="slider round"></span>
            </label>
          </div>
          <div class="other-notification-toggle" id="selector-3">
            <label>Not enough for new square</label>
            <label class="switch settings-switch">
                <input type="checkbox" id="notification-not-enough-new-square-toggle">
                <span class="slider round"></span>
            </label>
          </div>
          <div class="other-notification-toggle" id="selector-4">
            <label>Deletion</label>
            <label class="switch settings-switch">
                <input type="checkbox" id="notification-deletion-toggle">
                <span class="slider round"></span>
            </label>
          </div>
        </div>
        <div class="toggle">
          <label>No delete</label>
          <label class="switch settings-switch">
              <input type="checkbox" id="no-delete-toggle">
              <span class="slider round"></span>
          </label>
        </div>
        <div id="double-delete-container" class="toggle">
          <label>Double tap for delete</label>
          <label class="switch settings-switch">
              <input type="checkbox" id="double-tap-delete-toggle">
              <span class="slider round"></span>
          </label>
        </div>
        <div class="toggle">
          <label>No square movement</label>
          <label class="switch settings-switch">
              <input type="checkbox" id="no-square-movement-toggle">
              <span class="slider round"></span>
          </label>
        </div>
        <div class="toggle">
          <label for="settings-username-input">Username:</label>
          <input value="" type="text" id="settings-username-input">
        </div>
        <div id="log-out-container">
          <button id="log-out">Log Out</button>
        </div>
      </div>
    </div>
    <script src="setup-webgl2.js"></script>
    <script src="init-webgl2-images.js"></script>
    <script src="init-webgl2-shapes.js"></script>
    <script src="irregularitiesInfo.js"></script>
    <script src="script.js"></script>
  </body>
</html>
