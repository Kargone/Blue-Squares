<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1, viewport-fit=auto">
    <meta charset="utf-8" />
    <title>WebGL Demo</title>
    <link rel="stylesheet" href="style.css">
    <!-- <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
      integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
      crossorigin="anonymous"
      defer
    ></script>
    <script src="webgl-demo.js" type="module" defer></script> -->
  </head>
  <body id="body">
    <!-- needed buttons to close the create and info tabs -->
    <canvas id="game-canvas"></canvas>
    <div id="notifications"></div>
    <div id="building-create" class="collapse-building-create open-building-create">
      <!-- it will show the prices of the buildings that can currently be built, with arrows on the sides when you unlock more -->
      <img src="Images/create_blue_square.png" alt="Blue Square">
      <button id="blue-square-buy">Buy <span id="blue-square-cost">0</span><img src="Images/blue_square.png" alt="- Blue Squares" class="resource-image"></button>
      <div id="toggle-building-create">
        <p>▼</p>
       </div>
    </div>
    <div id="building-info" class="collapse-building-info open-building-info">
      <h2 id="building-info-no-content">No Content</h2>
      <div id="building-info-content">
        <h2 id="building-info-square_type">Square</h2>
        <h3 id="building-info-level">Level: </h3>
        <p id="building-info-earnings_second">Earnings per second: </p>
        <p id="building-info-earnings_hour">Earnings per second: </p>
        <button id="building-info-upgrade">Upgrade <span id="building-info-upgrade-number"></span><img src="Images/blue_square.png" alt="- Blue Squares" class="resource-image"></button>
        <p id="refund-text">*square will be 100% refunded*</p>
        <button id="building-info-delete">Delete <span id="building-info-delete-number"></span><img src="Images/blue_square.png" alt="- Blue Squares" class="resource-image"></button>
      </div>
      <!-- 
        Blue Sqaure
        Level: 10
        (when hover over upgrade button, -> appears with next level stats)
        Earnings per second:
        Earnings per hour:
        Date created: 

        Upgrade button (with the cost on it)
       -->
       <div id="toggle-building-info">
        <p>▶</p>
       </div>
    </div>
    <div id="settings">
      <!-- leaderboard
      settings -->
    </div>
    <div id="resources">
      <p><span id="blue-squares-count">XXXXX</span><img src="Images/blue_square.png" alt="- Blue Squares" class="resource-image"></p>
      <!-- <p>XXXXX<img src="Images/red_square.png" alt="- Red Squares" class="resource-image"></p>
      <p>XXXXX<img src="Images/green_square.png" alt="- Green Squares" class="resource-image"></p>
      <p>XXXXX<img src="Images/purple_square.png" alt="- Purple Squares" class="resource-image"></p> -->
    </div>
    <div id="resource-displays"></div>
    <script src="setup-webgl2.js"></script>
    <script src="init-webgl2-images.js"></script>
    <script src="init-webgl2-shapes.js"></script>
    <script src="irregularitiesInfo.js"></script>
    <script src="script.js"></script>
  </body>
</html>
