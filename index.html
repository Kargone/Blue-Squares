<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1, viewport-fit=auto">
    <meta charset="utf-8" />
    <title>Blue Squares</title>
    <link rel="stylesheet" href="style.css">
    <!-- <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
      integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
      crossorigin="anonymous"
      defer
    ></script>
    <script src="webgl-demo.js" type="module" defer></script> -->
  </head>
  <body id="body">
    <canvas id="game-canvas"></canvas>
    <div id="notifications"></div>
    <div id="building-create" class="collapse-building-create open-building-create">
      <!-- it will show the prices of the buildings that can currently be built, with arrows on the sides when you unlock more -->
      <div id="buy-buttons">
        <div id="first-buy">
          <img src="Images/create-squares/create-blue-square.png" alt="Blue Square">
          <button id="blue-square-buy">Buy <span id="blue-square-cost">0</span><img src="Images/resource-squares/blue-square.png" alt="- Blue Squares" class="resource-image"></button>
        </div>
        <div>
          <img src="Images/create-squares/create-red-square.png" alt="Red Square">
          <button id="red-square-buy">Buy <span id="red-square-cost">0</span><img src="Images/resource-squares/red-square.png" alt="- Red Squares" class="resource-image"></button>
        </div>
        <div>
          <img src="Images/create-squares/create-green-square.png" alt="Green Square">
          <button id="green-square-buy">Buy <span id="green-square-cost">0</span><img src="Images/resource-squares/green-square.png" alt="- Green Squares" class="resource-image"></button>
        </div>
        <div>
          <img src="Images/create-squares/create-purple-square.png" alt="Purple Square">
          <button id="purple-square-buy">Buy <span id="purple-square-cost">0</span><img src="Images/resource-squares/purple-square.png" alt="- Purple Squares" class="resource-image"></button>
        </div>
        <div>
          <img src="Images/create-squares/create-orange-square.png" alt="Orange Square">
          <button id="orange-square-buy">Buy <span id="orange-square-cost">0</span><img src="Images/resource-squares/orange-square.png" alt="- Orange Squares" class="resource-image"></button>
        </div>
        <div>
          <img src="Images/create-squares/create-yellow-square.png" alt="Yellow Square">
          <button id="yellow-square-buy">Buy <span id="yellow-square-cost">0</span><img src="Images/resource-squares/yellow-square.png" alt="- Yellow Squares" class="resource-image"></button>
        </div>
        <div id="last-buy">
          <img src="Images/create-squares/create-white-square.png" alt="White Square">
          <button id="white-square-buy">Buy <span id="white-square-cost">0</span><img src="Images/resource-squares/white-square.png" alt="- White Squares" class="resource-image"></button>
        </div>
      </div>
      <div id="toggle-building-create">
        <p>▼</p>
       </div>
    </div>
    <div id="building-info" class="collapse-building-info open-building-info">
      <h2 id="building-info-no-content">No Content</h2>
      <div id="building-info-content">
        <h2 id="building-info-square_type">Square</h2>
        <h3 id="building-info-level">Level: </h3>
        <p id="building-info-earnings_second">Earnings per second: </p>
        <p id="building-info-earnings_hour">Earnings per second: </p>
        <button id="building-info-upgrade">Upgrade <span id="building-info-upgrade-number"></span><img src="Images/resource-squares/blue-square.png" alt="- Blue Squares" class="resource-image"></button>
        <p id="refund-text">*square will be 100% refunded*</p>
        <button id="building-info-delete">Delete <span id="building-info-delete-number"></span><img src="Images/resource-squares/blue-square.png" alt="- Blue Squares" class="resource-image"></button>
      </div>
      <!-- 
        Blue Sqaure
        Level: 10
        (when hover over upgrade button, -> appears with next level stats)
        Earnings per second:
        Earnings per hour:
        Date created: 

        Upgrade button (with the cost on it)
       -->
       <div id="toggle-building-info">
        <p>▶</p>
       </div>
    </div>
    <div id="settings">
      <!-- leaderboard
      settings -->
    </div>
    <div id="resources">
      <p><span id="blue-squares-count">XXXXX</span><img src="Images/resource-squares/blue-square.png" alt="- Blue Squares" class="resource-image"></p>
      <p><span id="red-squares-count">XXXXX</span><img src="Images/resource-squares/red-square.png" alt="- Red Squares" class="resource-image"></p>
      <p><span id="green-squares-count">XXXXX</span><img src="Images/resource-squares/green-square.png" alt="- Green Squares" class="resource-image"></p>
      <p><span id="purple-squares-count">XXXXX</span><img src="Images/resource-squares/purple-square.png" alt="- Purple Squares" class="resource-image"></p>
      <p><span id="orange-squares-count">XXXXX</span><img src="Images/resource-squares/orange-square.png" alt="- Orange Squares" class="resource-image"></p>
      <p><span id="yellow-squares-count">XXXXX</span><img src="Images/resource-squares/yellow-square.png" alt="- Yellow Squares" class="resource-image"></p>
      <p><span id="white-squares-count">XXXXX</span><img src="Images/resource-squares/White-square.png" alt="- White Squares" class="resource-image"></p>
    </div>
    <div id="resource-displays"></div>
    <script src="setup-webgl2.js"></script>
    <script src="init-webgl2-images.js"></script>
    <script src="init-webgl2-shapes.js"></script>
    <script src="irregularitiesInfo.js"></script>
    <script src="script.js"></script>
  </body>
</html>
