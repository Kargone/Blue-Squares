<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1, viewport-fit=auto">
    <meta charset="utf-8" />
    <title>Blue Squares</title>
    <link rel="stylesheet" href="style-intro.css">
  </head>
  <body id="body">
    <canvas id="game-canvas"></canvas>
    <div id="notifications"></div>
    <h1 class="shimmer">Blue Squares</h1>
    <br>
    <button id="play">Play</button>
    <br>
    <button id="tutorial">Tutorial</button>
    <br>
    <button id="google-sign-in">Sign In</button>
    <script src="../setup-webgl2.js"></script>
    <script>
      let notificationRemoved = {'id': 'removed or not'};
      function notification(text) {
          let x = Math.floor(Math.random() * 1000000000);
          const newDiv = document.createElement("div");
          newDiv.innerHTML = `
              <p class="notificationText">${text}</p>
              <p class="deleteNotification" id="delete${x}">X</p>
              <div class="notificationTimeBar"></div>
          `;
          newDiv.classList = 'notification';
          newDiv.setAttribute("id", `noti${x}`);
          const currentDiv = document.getElementById("notifications");
          currentDiv.appendChild(newDiv);
          notificationRemoved[x] = false;
          document.getElementById(`delete${x}`).addEventListener('click', function () {
              removeNotification(x);
          });
          setTimeout(function() {
              if (notificationRemoved[x]) return;
              removeNotification(x);
          }, 3000);
          function removeNotification(x) {
              // document.getElementById("noti"+x).classList += " deletedNotification";
              setTimeout(function() {
                  // document.getElementById("noti"+x).remove();
                  notificationRemoved[x] = true;
              }, 500);
          }
      }
    </script>
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics.js";
      import { 
        getAuth, 
        signInWithPopup,
        GoogleAuthProvider, 
        signInAnonymously,
        EmailAuthProvider,
        linkWithCredential
      } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
      // TODO: Add SDKs for Firebase products that you want to use
      // https://firebase.google.com/docs/web/setup#available-libraries
    
      // Your web app's Firebase configuration
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyByhAfobvZt_OQu-32tVbXho6n2L4IaNEE",
        authDomain: "blue-squares-d1f83.firebaseapp.com",
        databaseURL: "https://blue-squares-d1f83-default-rtdb.firebaseio.com",
        projectId: "blue-squares-d1f83",
        storageBucket: "blue-squares-d1f83.appspot.com",
        messagingSenderId: "902439481018",
        appId: "1:902439481018:web:4cc44b28a38a62e8c01c83",
        measurementId: "G-Q5HDHVEEDJ"
      };
    
      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth();
      if (localStorage.getItem('blue-squares:user') != null) document.getElementById("google-sign-in").textContent = "Sign Out";
      document.getElementById("play").addEventListener('click', async function () {
        if (localStorage.getItem('blue-squares:user') != null) return window.location.href = "../index.html";
        signInAnonymously(auth).then(() => {
          // Signed in..
          notification('Sign in anonymously success');
          localStorage.setItem('blue-squares:sign-in-type', 'anonymous');
        })
        .catch((error) => {
          const errorCode = error.code;
          const errorMessage = error.message;
          // ...
          notification('Sign in anonymously fail');
        });
        window.location.href = "../index.html";
      });
      document.getElementById("google-sign-in").addEventListener('click', async function () {
        if (localStorage.getItem('blue-squares:user') != null) {
          localStorage.removeItem('blue-squares:user');
          localStorage.removeItem('blue-squares:sign-in-type');
          sessionStorage.clear();
          notification('Sign out');
          window.location.href = "intro-page.html";
          return;
        }
        const userCred = await signInWithPopup(auth, new GoogleAuthProvider());
        console.log(userCred);
        console.log(userCred.email, userCred.uid);
        const credential = EmailAuthProvider.credential(userCred.user.email, userCred.user.uid);
        console.log(credential);
        await linkWithCredential(auth.currentUser, credential)
          .then((usercred) => {
            const user = usercred.user;
            notification("Account linking success", user);
          }).catch((error) => {
            notification("Account linking error", error);
          });
        localStorage.setItem('blue-squares:user', JSON.stringify(userCred.user));
        localStorage.setItem('blue-squares:sign-in-type', 'google');
        notification('Sign into google');
        window.location.href = "../index.html";
      });
    </script>
    <script src="intro-page.js"></script>
  </body>
</html>
